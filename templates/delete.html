<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>削除確認</title>

<style>

body {
    margin: 0;
    font-family: sans-serif;
    background: #f4f6f9;
    font-size: 24px;
    line-height: 1.7;
}

.container {
    max-width: 700px;
    margin: 60px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    text-align: center;
}

h2 {
    font-size: 36px;
    color: #d9534f;
    margin-bottom: 20px;
}

.info {
    text-align: left;
    margin: 20px 0;
    padding: 20px;
    background: #f9f9f9;
    border-radius: 10px;
    overflow-wrap: break-word;
}

.big {
    font-size: 28px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 22px;
    font-size: 26px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    margin-top: 15px;
}

.btn-delete {
    background: #d9534f;
}

.btn-back {
    background: #999;
}

button:active {
    transform: scale(0.98);
}

</style>

</head>

<body>

<div class="container">

<div class="card">

{% if reservation %}

    <h2>
        この予約を<br>
        削除しますか？
    </h2>

    <div class="info">

        <p>
            <b>日付：</b>
            <span class="big">
                {{ reservation.data }}
            </span>
        </p>

        <p>
            <b>時間：</b>
            <span class="big" id="time_view"></span>
        </p>

        <p>
            <b>名前：</b>
            {{ reservation.name }}
        </p>

        <p>
            <b>電話：</b>
            {{ reservation.phone }}
        </p>

        <p>
            <b>住所：</b>
            {{ reservation.address }}
        </p>

        <p>
            <b>メール：</b>
            {{ reservation.email or "登録なし" }}
        </p>

    </div>


    <!-- 削除フォーム -->

    <form method="POST" action="/delete_confirm">

        <input
            type="hidden"
            name="date"
            value="{{ reservation.data }}"
        >

        <input
            type="hidden"
            name="time"
            value="{{ reservation.time }}"
        >

        <input
            type="hidden"
            name="name"
            value="{{ reservation.name }}"
        >

        <input
            type="hidden"
            name="phone"
            value="{{ reservation.phone }}"
        >

        <input
            type="hidden"
            name="address"
            value="{{ reservation.address }}"
        >

        <input
            type="hidden"
            name="email"
            value="{{ reservation.email or '' }}"
        >

        <button
            type="submit"
            class="btn-delete"
            onclick="return confirmDelete()"
        >
            削除する
        </button>

    </form>


    <!-- 戻る -->

    <form action="/">

        <button
            type="submit"
            class="btn-back"
        >
            戻る
        </button>

    </form>


{% else %}

    <h2>削除対象なし</h2>

    <p>
        現在、削除できる予約はありません。
    </p>

    <form action="/">

        <button
            type="submit"
            class="btn-back"
        >
            戻る
        </button>

    </form>

{% endif %}

</div>

</div>


<script>

function formatRange(t){

    if(!t) return "";

    let parts = t.split(":");

    let h = parseInt(parts[0]);
    let m = parseInt(parts[1]);

    if(isNaN(h) || isNaN(m)) return t;

    let end = new Date();

    end.setHours(h);
    end.setMinutes(m + 30);

    let eh = String(end.getHours()).padStart(2,'0');
    let em = String(end.getMinutes()).padStart(2,'0');

    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}～${eh}:${em}`;
}


let timeView = document.getElementById("time_view");

if(timeView){

    timeView.innerText =
        formatRange("{{ reservation.time }}");

}

</script>


<script>

window.addEventListener("load", function(){

    let form = document.querySelector('form[method="POST"]');

    if(form){

        form.addEventListener("submit", function(){

            document.getElementById(
                "loadingOverlay"
            ).style.display = "flex";

        });

    }

});

</script>


<script>

function confirmDelete(){

    if(confirm("本当に削除しますか？")){

        document.getElementById(
            "loadingOverlay"
        ).style.display = "flex";

        return true;

    }

    return false;

}

</script>


<div
    id="loadingOverlay"
    style="
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.4);
        z-index:9999;
        justify-content:center;
        align-items:center;
    "
>

    <div
        style="
            background:white;
            padding:30px 40px;
            border-radius:10px;
            text-align:center;
            font-size:20px;
        "
    >

        <div style="font-size:40px;">
            ⏳
        </div>

        しばらくお待ちください...

    </div>

</div>


</body>

</html>
